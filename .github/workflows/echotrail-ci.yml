name: EchoTrail CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Job to scan for secrets using Gitleaks
  gitleaks:
    name: Gitleaks Secrets Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches all history for Gitleaks to scan
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job for static analysis security testing (SAST) with CodeQL
  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: Perform custom build for CodeQL
        run: |
          mvn compile -B -f CapsuleMS/pom.xml
          mvn compile -B -f FriendshipMS/pom.xml
          mvn compile -B -f Gateway/pom.xml
          mvn compile -B -f ServiceRegistry/pom.xml
          mvn compile -B -f UserMS/pom.xml
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # Backend CI Job: builds, tests, and analyzes each microservice
  backend:
    name: Backend CI
    needs: [gitleaks, codeql]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '21' ]
        service:
          - name: 'capsulems'
            path: 'CapsuleMS'
          - name: 'friendshipms'
            path: 'FriendshipMS'
          - name: 'gateway'
            path: 'Gateway'
          - name: 'serviceregistry'
            path: 'ServiceRegistry'
          - name: 'userms'
            path: 'UserMS'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # SonarCloud needs a full clone to correctly analyze history and assign issues.
          fetch-depth: 0

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and test with Maven
        run: mvn -B verify --file ${{ matrix.service.path }}/pom.xml

      - name: SonarCloud Scan
        if: matrix.java == '21' # Run scan only on the latest Java version
        run: >
          mvn -B sonar:sonar
          --file ${{ matrix.service.path }}/pom.xml
          -Dsonar.projectKey=santhoshkumarCodes_EchoTrail
          -Dsonar.projectName=${{ matrix.service.name }}
          -Dsonar.host.url=https://sonarcloud.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to decorate PRs with analysis results
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}   # Token for authentication with SonarCloud

  # Docker Job: Lints Dockerfiles, builds images, and scans for vulnerabilities
  docker:
    name: Docker Build & Scan
    needs: backend
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: 'capsulems'
            path: 'CapsuleMS'
          - name: 'friendshipms'
            path: 'FriendshipMS'
          - name: 'gateway'
            path: 'Gateway'
          - name: 'serviceregistry'
            path: 'ServiceRegistry'
          - name: 'userms'
            path: 'UserMS'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ matrix.service.name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-${{ matrix.service.name }}-

      - name: Install Hadolint
        run: |
          sudo wget -O /usr/local/bin/hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint
      - name: Lint Dockerfile
        run: hadolint ${{ matrix.service.path }}/Dockerfile

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service.path }}
          file: ./${{ matrix.service.path }}/Dockerfile
          push: false # Do not push image to a registry
          tags: echotrail/${{ matrix.service.name }}:latest
          load: true # Load image into docker for scanning
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'echotrail/${{ matrix.service.name }}:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
